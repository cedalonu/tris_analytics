name: Deploy TRIS main and research preview

on:
  push:
    branches: ["main", "research-core-v1"]
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main (production site)
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-source

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: main-source/package-lock.json

      - name: Install main dependencies
        working-directory: main-source
        run: npm ci --legacy-peer-deps

      - name: Build production site from main
        working-directory: main-source
        run: npm run build

      - name: Checkout research-core-v1 preview
        uses: actions/checkout@v4
        with:
          ref: research-core-v1
          path: research-preview-source

      - name: Install research preview dependencies
        working-directory: research-preview-source
        run: npm ci --legacy-peer-deps

      - name: Build research preview
        working-directory: research-preview-source
        run: npm run build

      - name: Assemble Pages site without replacing production root
        run: |
          mkdir -p main-source/dist/research-preview
          cp -a research-preview-source/dist/. main-source/dist/research-preview/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload combined Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: main-source/dist

      - name: Deploy combined site
        uses: actions/deploy-pages@v4
