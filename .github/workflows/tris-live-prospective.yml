name: TRIS live prospective cycle

on:
  push:
    branches: [research-core-v1]
  schedule:
    # Revisa Pakin cada hora; captura las cinco actualizaciones diarias sin depender de commits.
    - cron: '25 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: tris-live-prospective-research-core-v1
  cancel-in-progress: false

jobs:
  cycle:
    if: github.ref == 'refs/heads/research-core-v1' && (github.event_name != 'push' || github.actor != 'github-actions[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out research branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Restore latest successful prospective ledger
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          previous_run_id=$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow "TRIS live prospective cycle" \
            --branch research-core-v1 \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId // empty')
          if [ -n "$previous_run_id" ]; then
            echo "Restoring previous successful ledger from run $previous_run_id"
            gh run download "$previous_run_id" \
              --repo "$GITHUB_REPOSITORY" \
              --name tris-live-prospective-ledger \
              --dir restored-ledger
            if [ ! -d restored-ledger/cycles ]; then
              echo "Previous artifact has no cycles directory; refusing to bootstrap over missing state."
              exit 1
            fi
            mkdir -p data/cycles data/source-snapshots
            cp -a restored-ledger/cycles/. data/cycles/
            if [ -d restored-ledger/source-snapshots ]; then
              cp -a restored-ledger/source-snapshots/. data/source-snapshots/
            fi
          else
            echo "No prior successful live ledger; this is the prospective bootstrap."
          fi
      - name: Fetch, validate, run and audit latest official CSV
        run: npm run research:cycles:source
      - name: Publish validated canonical historical dataset
        run: |
          set -euo pipefail
          mkdir -p data/canonical
          snapshot=$(find data/source-snapshots -maxdepth 1 -type f -name 'Tris-*.csv' | sort -V | tail -n 1)
          test -n "$snapshot"
          manifest="${snapshot%.csv}.json"
          test -f "$manifest"
          cp "$snapshot" data/canonical/Tris.csv
          cp "$manifest" data/canonical/source-manifest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/canonical/Tris.csv data/canonical/source-manifest.json
          if git diff --cached --quiet; then
            echo "Canonical TRIS dataset is unchanged; no commit required."
          else
            git commit -m "data(tris): refresh validated canonical history"
            # Another research commit may land while the source is being processed.
            # Rebase the isolated data commit instead of losing either update.
            git pull --rebase origin research-core-v1
            git push origin research-core-v1
          fi
      - name: Rebuild and audit INA outputs against the newly validated canonical snapshot
        run: npm run research:ina-canonical-audit -- data/canonical/Tris.csv data/canonical/source-manifest.json
      - name: Record source freshness and INA propagation in job summary
        if: always()
        run: |
          echo "## TRIS — actualización de fuente Pakin" >> "$GITHUB_STEP_SUMMARY"
          echo "- Revisión programada: cada hora, minuto 25 (UTC)." >> "$GITHUB_STEP_SUMMARY"
          echo "- Fuente: https://raw.githubusercontent.com/pakinja/pakin/master/Tris.csv" >> "$GITHUB_STEP_SUMMARY"
          if [ -f data/cycles/latest-report.md ]; then cat data/cycles/latest-report.md >> "$GITHUB_STEP_SUMMARY"; fi
          if [ -f reports/ina-canonical-audit/latest.md ]; then cat reports/ina-canonical-audit/latest.md >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Publish current cycle summary
        run: |
          if [ -f data/cycles/latest-report.md ]; then
            cat data/cycles/latest-report.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload append-only prospective ledger and source snapshots
        uses: actions/upload-artifact@v4
        with:
          name: tris-live-prospective-ledger
          path: |
            data/cycles/
            data/source-snapshots/Tris-*.csv
            data/source-snapshots/Tris-*.json
            reports/ina-canonical-audit/latest.json
            reports/ina-canonical-audit/latest.md
          if-no-files-found: error
          retention-days: 90
