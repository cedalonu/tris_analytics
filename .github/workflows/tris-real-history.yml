name: TRIS real-history integration validation

on:
  push:
    branches: [research-core-v1]
  workflow_dispatch:
    inputs:
      restore_run_id:
        description: "Previous successful real-history run ID to restore prospective ledger from (optional)"
        required: false
        type: string

permissions:
  contents: read
  actions: read

jobs:
  real-history:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out research branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: TypeScript check
        run: npm run lint
      - name: Research unit tests
        run: npm run test:research
      - name: Build application
        run: npm run build
      - name: Validate selected restore run
        if: github.event_name == 'workflow_dispatch' && inputs.restore_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RESTORE_RUN_ID: ${{ inputs.restore_run_id }}
        run: |
          set -euo pipefail
          run_json=$(gh run view "$RESTORE_RUN_ID" --repo "$GITHUB_REPOSITORY" --json workflowName,status,conclusion,headBranch)
          echo "$run_json" | jq -e '
            .workflowName == "TRIS real-history integration validation" and
            .status == "completed" and
            .conclusion == "success" and
            .headBranch == "research-core-v1"
          ' >/dev/null || {
            echo "Restore source must be a successful completed real-history run from research-core-v1."
            exit 1
          }
      - name: Restore prior prospective ledger (explicit opt-in)
        if: github.event_name == 'workflow_dispatch' && inputs.restore_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: tris-real-history-validation
          run-id: ${{ inputs.restore_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          path: restored-artifact
      - name: Restore only prospective ledger files
        if: github.event_name == 'workflow_dispatch' && inputs.restore_run_id != ''
        run: |
          if [ ! -d restored-artifact/data/prospective ]; then
            echo "The selected artifact has no data/prospective ledger; refusing restore."
            exit 1
          fi
          mkdir -p data/prospective
          cp -a restored-artifact/data/prospective/. data/prospective/
          echo "Restored prior ledger files. Integrity/portfolio checks run in downstream audit steps."
      - name: Validate and checkpoint the exact CSV snapshot
        run: npm run research:sync -- data/source-snapshots/Tris-2026-11-25.csv data/tris-sync-checkpoint.json
      - name: Run frozen chronological hypothesis validation
        run: npm run research:validate -- data/source-snapshots/Tris-2026-11-25.csv data/prospective
      - name: Run historical regime analysis
        run: npm run research:regime -- data/source-snapshots/Tris-2026-11-25.csv
      - name: Run historical-only past-only positional regime analysis
        run: npm run research:historical-regime-analysis -- data/source-snapshots/Tris-2026-11-25.csv
      - name: Validate joint digit dependence on chronological holdout
        run: npm run research:joint-digit-dependence-validation -- data/source-snapshots/Tris-2026-11-25.csv 11033 30505 30506 36997 999 1192026
      - name: Run positional-pool permutation null controls
        run: npm run research:positional-pool-null-controls -- reports/historical-regime-analysis/latest.json
      - name: Run positional-pool circular-shift controls
        run: npm run research:positional-pool-circular-shift -- reports/historical-regime-analysis/latest.json
      - name: Compare positional-pool null controls
        run: npm run research:positional-pool-null-comparison
      - name: Run positional-pool chronological split
        run: npm run research:positional-pool-temporal-split -- reports/historical-regime-analysis/latest.json
      - name: Run temporal memory
        run: npm run research:memory -- data/source-snapshots/Tris-2026-11-25.csv
      - name: Run contextual memory
        run: npm run research:context-memory -- data/source-snapshots/Tris-2026-11-25.csv
      - name: Run adaptive signal memory
        run: npm run research:adaptive-memory -- data/source-snapshots/Tris-2026-11-25.csv
      - name: Run regime-conditioned memory
        run: npm run research:regime-memory -- data/source-snapshots/Tris-2026-11-25.csv
      - name: Run cross-family concordance
        run: npm run research:concordance -- data/source-snapshots/Tris-2026-11-25.csv
      - name: Run signal interactions
        run: npm run research:interactions -- data/source-snapshots/Tris-2026-11-25.csv
      - name: Run collective behavior
        run: npm run research:collective -- data/source-snapshots/Tris-2026-11-25.csv
      - name: Run persistence analysis
        run: npm run research:persistence -- data/source-snapshots/Tris-2026-11-25.csv
      - name: Run full historical walk-forward pool matrix
        run: npm run research:pools -- data/source-snapshots/Tris-2026-11-25.csv
      - name: Run portfolio walk-forward benchmarks
        env:
          TRIS_PORTFOLIO_SIZES: "10"
          TRIS_PORTFOLIO_RANDOM_REPS: "5"
        run: npm run research:portfolio-walk-forward -- data/source-snapshots/Tris-2026-11-25.csv
      - name: Freeze next-draw prospective hypotheses
        run: npm run research:prospective -- data/source-snapshots/Tris-2026-11-25.csv data/prospective
      - name: Audit prospective ledger integrity
        run: npm run research:prospective-audit -- data/prospective
      - name: Audit prospective coverage
        run: npm run research:prospective-coverage -- data/source-snapshots/Tris-2026-11-25.csv data/prospective
      - name: Report prospective performance
        run: npm run research:prospective-performance -- data/prospective
      - name: Report prospective temporal stability
        run: npm run research:prospective-performance-stability -- data/prospective
      - name: Report prospective parameter sensitivity
        run: npm run research:prospective-performance-sensitivity -- data/prospective
      - name: Aggregate research report pack
        run: npm run research:report-pack
      - name: Generate hypothesis evidence dossiers
        run: npm run research:evidence-dossiers
      - name: Track hypothesis state transitions
        run: npm run research:hypothesis-tracker
      - name: Generate hypothesis alert events
        run: npm run research:hypothesis-alerts
      - name: Upload real-history reports and frozen ledgers
        uses: actions/upload-artifact@v4
        with:
          name: tris-real-history-validation
          path: |
            reports/**
            data/prospective/**
            data/tris-sync-checkpoint.json
          if-no-files-found: error
          retention-days: 90
