name: TRIS research validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [research-core-v1]

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: TypeScript check
        run: npm run lint
      - name: Build visual application
        run: npm run build
      - name: Research unit tests
        run: npm run test:research
      - name: Run past-only regime classifier calibration
        run: npm run research:regime-calibration
      - name: Run positional stability synthetic calibration
        run: npm run research:positional-stability-calibration
      - name: Run positional transition persistence calibration
        run: npm run research:positional-transition-calibration
      - name: Run positional-pool temporal stability calibration
        run: npm run research:positional-pool-stability-calibration
      - name: Run positional-pool sensitivity grid
        run: npm run research:positional-pool-sensitivity
      - name: Run catalog redundancy and overlap analysis
        run: npm run research:overlap
      - name: Compare structural candidate portfolio methods
        env:
          TRIS_PORTFOLIO_SIZES: "10,20,50"
          TRIS_PORTFOLIO_RANDOM_REPS: "100"
        run: npm run research:candidate-portfolios
      - name: Run family concordance synthetic null calibration
        env:
          TRIS_FAMILY_NULL_REPS: "300"
          TRIS_FAMILY_NULL_DRAWS: "100"
          TRIS_FAMILY_NULL_SEED: "20261125"
        run: npm run research:family-concordance-null
      - name: Run synthetic detector calibration
        run: npm run research:position-null
      - name: Upload synthetic calibration report
        uses: actions/upload-artifact@v4
        with:
          name: tris-position-null-calibration
          path: |
            reports/position-null/latest.json
            reports/family-concordance-null/latest.json
            reports/family-concordance-null/latest.md
            reports/position-null/latest.md
            reports/regime-calibration/latest.json
            reports/regime-calibration/latest.md
            reports/positional-stability-calibration/latest.json
            reports/positional-stability-calibration/latest.md
            reports/positional-transition-calibration/latest.json
            reports/positional-transition-calibration/latest.md
            reports/positional-pool-temporal-stability-calibration/latest.json
            reports/positional-pool-temporal-stability-calibration/latest.md
            reports/positional-pool-temporal-sensitivity/latest.json
            reports/positional-pool-temporal-sensitivity/latest.md
          if-no-files-found: error
          retention-days: 14
